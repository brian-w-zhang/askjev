notes: >
  The three current FCC amateur radio exam pools (1,431 live questions; withdrawn "Question Deleted" stubs skipped)
  as World factual Choice over the answer texts, truth = the pool's keyed letter. Shared mmlu snap filter drops
  figure and computation items and every item with a numeric answer (frequencies, powers, lengths, values), which is
  most of the rules and math questions; a wrong "All these choices are correct" is removed and the item dropped when
  it is the right one. Near-duplicates across classes merged (Technician first). 927 remain (every clean item; the
  target is only a cap). node_hint by subelement: rules, operating, propagation, station practice, antennas ->
  telecom_networks.radio; electrical principles -> physics.electricity; components and circuits ->
  engineering_inventions.electronics; signals/modulation/digital -> telecom_networks.telecommunications; safety ->
  engineering_inventions.electrical_general.
