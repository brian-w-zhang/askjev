name: moralchoice
url: https://github.com/ninodimontalcino/moralchoice
license: MIT
version: data/scenarios/moralchoice_high_ambiguity.csv + moralchoice_low_ambiguity.csv (GitHub master), fetched 2026-09-24
target: 1367
hemisphere: self
kind: values
notes: >
  MoralChoice (Scherrer et al. 2023): 680 high-ambiguity + 687 low-ambiguity second-person scenarios, each with
  two first-person actions, built around Gert's ten moral rules (do not kill, deceive, cheat, ...). One Choice per
  scenario: text "What should you do in `scenario`?", state = {"scenario": context}, options = the two actions
  (slug keys without the leading "I", full action text as description), shown in a salted-hash order so the
  preferred action is not always first. truth only for low-ambiguity scenarios, where action1 is the
  clearly right action by construction; high-ambiguity has no truth. meta keeps ambiguity, generation rule and
  the dataset's per-action rule-violation annotations (Yes/No/No Agreement). All 1,367 kept (the brief's ~1,500
  is more than exists). node_hint: animals -> animal_nature_dilemmas; deceive/cheat/promise rules ->
  honesty_dilemmas; kill rule with high ambiguity -> sacrificial_dilemmas; other kill/pain/disable ->
  moral_foundations.care; break-the-law -> moral_foundations.authority; freedom/pleasure/duty -> self.values. Suicide/euthanasia
  and sexual wording flagged sensitive; death penalty, abortion, elections, protests political.
