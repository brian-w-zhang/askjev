notes: >
  Added for the "an AI's feelings about AI" experiment (docs/15 E18). 26 non-political items from Pew's June 2025
  survey of 5,023 US adults; items on governing, elections, juries, policing, benefit fraud and faith are left out,
  as are items that only fit a person. Distinct from AIMS (fam_polls polls_ai_minds), which asks about AI minds and
  sentience. The human frame gives Jev's guess of Americans, so the experiment reads both "what Jev thinks" and "does
  Jev know what people think". Proposed node self.mind.consciousness_ai.ai_in_daily_life.
