notes: >
  Added for the "which headline got more clicks" experiment (research pass 2 idea 35). Two versions of the same
  Upworthy test with the same image and different headlines, each shown to 1,000+ readers; one pair per test; the
  truth is the higher click-through rate. 200 pairs in each third of the click gap (log ratio of the rates), with the
  two-proportion z kept in meta so noise-level gaps can be separated. Tests touching politics or contested issues are
  dropped by keyword before sampling. Placed at a new node world.society.media_news.journalism.headline_tests.
