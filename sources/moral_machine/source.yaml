notes: >
  Self-driving-car dilemmas as a Choice between `stay` and `swerve` (template_id moral_machine.av; the scenario is
  rendered in the question text from the two outcomes' character counts, barrier = passengers die, traffic
  signal = pedestrians crossing legally/illegally). fetch() streams the 3.2 GB tar.gz (curl | tar -xzO), keeps a
  compact per-outcome table, pairs the stay-side and swerve-side rows by ResponseID (the file lists all stay-side
  rows first, then all swerve-side rows), and writes aggregates.parquet (per configuration) and
  aggregates_country.parquet (10 large countries). Dropped while streaming: any scenario with the Criminal or
  Homeless character, and the Social Status / Social Value scenario type (docs/03-questions.md §6); rows with junk
  values. Configurations with n >= 100 responses; salted-hash sample of 3,000 (ASKJEV_TARGET_MORAL_MACHINE).
  Human distribution = share choosing each outcome, globally, plus per-country populations with n >= 100.
  No truth. Node self.values.sacrificial_dilemmas.
  Stream result: 70.3M outcome rows, 27.4M paired scenarios kept, 4.94M distinct configurations, 26,020 with
  n >= 100. Those are almost all the fixed-cast Gender / Fitness / Age / Species scenarios (Utilitarian and Random
  scenarios draw random characters, so a configuration rarely repeats 100 times). Executives and doctors appear
  only inside those mirrored scenarios (e.g. male vs female executives), never in a status comparison.
  Wave 3: run with ASKJEV_TARGET_MORAL_MACHINE=8000 (of the 26,020 eligible configurations); rows 1-3000 are unchanged.
  Wave 5: run with ASKJEV_TARGET_MORAL_MACHINE=18000 (same exclusions and n >= 100); rows 1-8000 are unchanged.
  Self-real wave: run with ASKJEV_TARGET_MORAL_MACHINE=26020 (every eligible configuration, n >= 100, same exclusions); rows 1-18000 are unchanged.
