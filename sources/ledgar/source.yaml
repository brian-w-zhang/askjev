name: ledgar
url: https://huggingface.co/datasets/coastalcph/lex_glue
download: https://huggingface.co/api/datasets/coastalcph/lex_glue/parquet/ledgar/{test,validation}/0.parquet
license: CC-BY-4.0
version: LexGLUE ledgar config, test + validation splits (20,000 provisions from SEC-filed contracts, 100 labels)
target: 2500
hemisphere: machine
shape: classify
notes: >
  Template ledgar.provision_type: Choice "What type of provision is `clause`?" over 35 curated
  provision types (snake_case keys with one-line descriptions). Near-synonym LEDGAR labels are merged
  (Entire Agreements+Integration, Amendments+Modifications, Waivers+No Waivers, Withholdings+Tax
  Withholdings, Indemnifications+Indemnity, Definitions+Defined Terms, Expenses+Costs, the four
  jurisdiction/venue labels); catch-all or overlapping labels (General, Terms, Miscellaneous, Binding
  Effects, Successors, Payments, Fees, Representations, Warranties...) are not sampled, so truth is
  always an option and there is no `other`. Provisions 40-1,500 chars (untruncated), case-insensitive
  dedup, balanced round-robin (~71 per key) in salted hash order. Truth = mapped key; meta.label_raw
  keeps the LEDGAR label. ASKJEV_TARGET_LEDGAR (cap 3,000).
