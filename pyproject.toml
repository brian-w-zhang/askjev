[project]
name = "askjev"
version = "0.1.0"
description = "A tree housing every closed question, answered by Jev"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "polars>=1.0",
  "pyarrow>=16",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "orjson>=3.10",
  "zstandard>=0.22",
  "fastembed>=0.4",
  "scikit-learn>=1.5",
  "huggingface-hub>=0.24",
  "openpyxl>=3.1",
]

[project.scripts]
askjev = "askjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askjev"]

[dependency-groups]
dev = ["pytest>=8"]
