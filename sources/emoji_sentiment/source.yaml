notes: >
  Added for the emoji-sentiment experiment (research pass 2, idea 7). The human distribution is the share of
  negative, neutral and positive labels among the annotated tweets that contain the emoji (Kralj Novak et al.
  2015, PLoS ONE 10(12): e0144296). Only emojis in 50+ labeled tweets (300 of 969). Jev sees the emoji itself, not
  its Unicode name. Placed at a new node world.society.languages.word.emoji_sentiment.
