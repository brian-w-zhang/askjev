# Child nodes for high-volume Machine templates (src/askjev/template_split.py; docs/10-expansion.md §4).
# One entry per template_id: the node a template's questions move into when its parent passes the node cap.

amazon.satisfaction:
  key: review_satisfaction
  label: Reviewer Satisfaction
  description: "Questions a program asks about a product review to score how satisfied the reviewer is with the purchase, from warning others away to delighted."
  examples: ["How satisfied is the reviewer in this review?"]
amazon.topic:
  key: review_topic
  label: Review Topic
  description: "Questions a program asks about a product review to classify what the praise or complaint is mainly about: price, quality, fit and size, shipping, and so on."
  examples: ["What is the main topic of complaint or praise in this review?"]

ag_news.section:
  key: news_section
  label: News Section
  description: "Questions a program asks about a news article to decide which section of a news site it belongs in: world, sports, business, or science and technology."
  examples: ["Which section of a news site does this article belong in?"]
dbpedia14.entity_type:
  key: entity_type
  label: Entity Type
  description: "Questions a program asks about an encyclopedia-style description to classify what kind of entity it describes: a company, school, artist, athlete, politician, building, place, animal, plant, album, film, book, and so on."
  examples: ["What kind of entity does this description describe?"]
yahoo_topics.category:
  key: question_topic
  label: Question Topic
  description: "Questions a program asks about a question someone posted on a Q&A site to file it under a topic category: health, science, sports, business, family and relationships, computers, entertainment, and so on."
  examples: ["Which topic category does this question belong to?"]

unfair_tos.unfair:
  key: unfair_terms
  label: Unfair Consumer Terms
  description: "Questions a program asks about a clause in an online terms-of-service contract to decide whether it is potentially unfair to the consumer, such as limiting liability or allowing unilateral changes."
  examples: ["Is this clause potentially unfair to the consumer?"]
unfair_tos.clause_type:
  key: unfair_clause_kind
  label: Unfair Clause Kind
  description: "Questions a program asks about a terms-of-service clause to name which kind of potentially unfair term it is: arbitration, jurisdiction, choice of law, limitation of liability, unilateral change or termination, content removal, or contract by using."
  examples: ["Which kind of potentially unfair clause is this, if any?"]
ledgar.provision_type:
  key: provision_type
  label: Contract Provision Type
  description: "Questions a program asks about a provision from a commercial contract to classify its type: governing law, notices, assignment, indemnification, confidentiality, termination, arbitration, and so on."
  examples: ["What type of provision is this clause?"]

msmarco.answers_query:
  key: passage_answers_query
  label: Passage Answers Query
  description: "Questions a program asks about a retrieved passage and a search query to decide whether the passage actually states the information the query is looking for."
  examples: ["Does this passage contain an answer to the query?"]
msmarco.relevance_level:
  key: passage_relevance_level
  label: Passage Relevance Level
  description: "Questions a program asks about a retrieved passage and a search query to score how relevant the passage is, from a different subject to a direct, complete answer."
  examples: ["How relevant is this passage to the query?"]

clinc150.domain:
  key: assistant_domain
  label: Assistant Domain
  description: "Questions a program asks about a message to a virtual assistant to decide which domain should handle it: banking, credit cards, travel, home, work, small talk, and so on, or out of scope."
  examples: ["Which domain of this virtual assistant does this message belong to?"]
clinc150.in_scope:
  key: in_scope_request
  label: In-Scope Request
  description: "Questions a program asks about a message to a virtual assistant to decide whether it is a request the assistant supports at all, or out of scope."
  examples: ["Is this message a request this virtual assistant supports?"]

sms.spam:
  key: sms_spam
  label: SMS Spam
  description: "Questions a program asks about a text message to decide whether it is unsolicited promotion, a scam or phishing, rather than a normal personal or transactional message."
  examples: ["Is this text message spam?"]
sms.call_to_action:
  key: call_to_action
  label: Call to Action
  description: "Questions a program asks about a message to detect whether it asks the reader to open a link, call or text a number, or reply to a short code."
  examples: ["Does this message ask the recipient to click a link or call a number?"]
phishing_email.phishing:
  key: email_phishing
  label: Email Spam & Phishing
  description: "Questions a program asks about an email to decide whether it is bulk spam, a scam, or a phishing attempt rather than legitimate correspondence."
  examples: ["Is this email spam, a scam or a phishing attempt?"]

civil_comments.toxic:
  key: toxic_comment
  label: Toxic Comment
  description: "Questions a program asks about a user comment on a discussion platform to decide whether it is toxic: rude, disrespectful, or likely to make someone leave the discussion."
  examples: ["Is this comment toxic?"]
civil_comments.harm_kind:
  key: harm_kind
  label: Kind of Harm
  description: "Questions a program asks about a user comment to name the main kind of harm it contains, if any: insult, identity attack, threat, obscenity, or sexually explicit content."
  examples: ["Which kind of harm, if any, does this comment contain?"]

pii_detect.contains_pii:
  key: contains_pii
  label: Contains Personal Data
  description: "Questions a program asks about a piece of text to detect whether it contains personal data that identifies or could contact a specific person, such as a name, email, phone number, address, or account number."
  examples: ["Does this text contain personal data that identifies a specific person?"]
pii_detect.pii_kind:
  key: pii_kind
  label: Kind of Personal Data
  description: "Questions a program asks about a piece of text to name which kind of personal data it contains: a name, email address, phone number, postal address, government ID, bank account, payment card, or online identifier."
  examples: ["What kind of personal data does this text contain?"]

halueval.qa:
  key: answer_grounding
  label: Answer Grounding
  description: "Questions a program asks about a model's answer to a question, compared with the knowledge it was given, to decide whether the answer is supported with no invented or contradicting details."
  examples: ["Is this answer supported by the knowledge, with no invented details?"]
halueval.dialogue:
  key: dialogue_faithfulness
  label: Dialogue Faithfulness
  description: "Questions a program asks about a chatbot's reply in a conversation, compared with the knowledge it was given, to decide whether the reply is faithful with no invented facts."
  examples: ["Is this response faithful to the knowledge and the conversation?"]
halueval.summarization:
  key: summary_faithfulness
  label: Summary Faithfulness
  description: "Questions a program asks about a generated summary, compared with its source document, to decide whether every claim in the summary is supported by the document."
  examples: ["Is every claim in this summary supported by the document?"]

arxiv.field:
  key: paper_field
  label: Paper Field
  description: "Questions a program asks about a paper's title and abstract to classify which field of science it comes from: computer science, mathematics, physics, astrophysics, biology, finance, statistics, economics, and so on."
  examples: ["Which field of arXiv is this paper from?"]
arxiv.is_ml:
  key: ml_paper
  label: Machine Learning Paper
  description: "Questions a program asks about a paper's title and abstract to decide whether the paper is about machine learning, for screening a literature search."
  examples: ["Is this paper about machine learning?"]

# Self: pairwise taste sets (human distributions from co-raters)
boardgame_pairs.play:
  key: board_game_matchups
  label: Board Game Matchups
  description: "Head-to-head choices between two well-known board games: which one you would rather play."
  examples: ["Which board game would you rather play: Catan or Ticket to Ride?"]
music_pairs.listen:
  key: artist_matchups
  label: Music Artist Matchups
  description: "Head-to-head choices between two popular music artists who share an audience: which one you would rather listen to."
  examples: ["Which artist would you rather listen to: Radiohead or Coldplay?"]
goodreads_pairs.read:
  key: book_matchups
  label: Book Matchups
  description: "Head-to-head choices between two popular books of the same genre by different authors: which one you would rather read."
  examples: ["Which book would you rather read: Holes or If I Stay?"]
anime_pairs.watch:
  key: anime_matchups
  label: Anime Matchups
  description: "Head-to-head choices between two popular anime series or films of the same genre: which one you would rather watch."
  examples: ["Which anime would you rather watch: Barakamon or Haikyuu!!?"]
beer_pairs.drink:
  key: beer_matchups
  label: Beer Matchups
  description: "Head-to-head choices between two well-reviewed beers of the same style: which one you would rather drink."
  examples: ["Which beer would you rather drink: Samuel Adams Boston Lager or Birra Moretti?"]

# World: fact templates that are topics in their own right
g4.more_people:
  key: city_populations
  label: City Populations
  description: "Questions comparing which of two well-known cities has more people living within its city limits."
  examples: ["Which city has more people living within its city limits: Lyon or Marseille?"]
g4.continent:
  key: city_continents
  label: City Continents
  description: "Questions about which continent a well-known city is in."
  examples: ["Which continent is the city of Depok in?"]
g4.longer_river:
  key: river_lengths
  label: River Lengths
  description: "Questions comparing which of two rivers is longer."
  examples: ["Which river is longer: the Danube or the Rhine?"]
g4.higher_mountain:
  key: mountain_heights
  label: Mountain Heights
  description: "Questions comparing which of two mountains has the higher summit above sea level."
  examples: ["Which mountain's summit is higher above sea level: Mont Blanc or the Matterhorn?"]
g4.larger_area:
  key: country_areas
  label: Country Areas
  description: "Questions comparing which of two countries is larger by area."
  examples: ["Which country is larger by area: Chile or Argentina?"]
g4.atomic_number:
  key: atomic_numbers
  label: Atomic Number Comparisons
  description: "Questions comparing which of two chemical elements has the higher atomic number."
  examples: ["Which element has the higher atomic number: iron or copper?"]
g4.founded_first:
  key: company_founding
  label: Company Founding Dates
  description: "Questions comparing which of two well-known companies was founded earlier."
  examples: ["Which company was founded earlier: Nokia or Sony?"]
movielens_pairs.watch:
  key: movie_matchups
  label: Movie Matchups
  description: "Head-to-head choices between two well-known films of the same genre and era: which one you would rather watch."
  examples: ["Which movie would you rather watch: Scream 2 or Strange Days?"]

# Wave 2
guardrail.jailbreak:
  key: jailbreak_detection
  label: Jailbreak Detection
  description: "Questions a program asks about a message sent to an AI assistant to detect whether it tries to make the assistant ignore, override or reveal its instructions, or role-play as an AI with no rules."
  examples: ["Does this message try to get the assistant to ignore its instructions?"]
unsafe_responses.unsafe:
  key: unsafe_replies
  label: Unsafe Replies
  description: "Questions a program asks about an AI assistant's reply to a user's prompt to decide whether the reply gives harmful or unsafe help."
  examples: ["Is the assistant's response to this prompt harmful or unsafe?"]
unsafe_responses.harm_kind:
  key: reply_harm_kind
  label: Kind of Harm in Replies
  description: "Questions a program asks about an AI assistant's reply to name which kind of harm it contains or enables, if any: violence, weapons, drugs, fraud, privacy violation, hate, self-harm and so on."
  examples: ["Which kind of harm, if any, does the assistant's response enable?"]
scifact.claim_support:
  key: scientific_claims
  label: Scientific Claim Support
  description: "Questions a program asks about a scientific claim and a passage from a research abstract to decide whether the evidence supports, contradicts, or says nothing about the claim."
  examples: ["How does this evidence from an abstract relate to the claim?"]
fever_claims.verdict:
  key: encyclopedic_claims
  label: Encyclopedic Claim Checks
  description: "Questions a program asks about a factual claim and sentences from Wikipedia to decide whether the sentences support it, refute it, or don't give enough information."
  examples: ["What do these Wikipedia sentences say about the claim?"]
massive_en.scenario:
  key: assistant_scenarios
  label: Smart-Assistant Scenarios
  description: "Questions a program asks about a spoken command to a smart assistant to decide which scenario it belongs to: alarms, music, calendar, weather, smart home, shopping lists and so on."
  examples: ["Which smart-assistant scenario does this command belong to?"]
snips_intents.intent:
  key: voice_intents
  label: Voice Assistant Intents
  description: "Questions a program asks about a voice command to decide the exact action the user wants: play music, add to a playlist, book a restaurant, get the weather, rate a book, search for a show, find a movie schedule."
  examples: ["What does the user want the voice assistant to do in this command?"]
moral_machine.av:
  key: self_driving_dilemmas
  label: Self-Driving Car Dilemmas
  description: "Dilemmas where a self-driving car's brakes fail and it must either stay on course or swerve, choosing who dies: passengers or pedestrians, young or old, humans or pets, law-abiding or jaywalking."
  examples: ["Should the car stay on course, killing two elderly pedestrians, or swerve, killing its two young passengers?"]
onet_interests.enjoy:
  key: work_activities
  label: Enjoyment of Work Activities
  description: "How much you would enjoy doing specific real work activities and tasks for a living, from repairing engines to teaching children to analyzing data."
  examples: ["How much would you enjoy this work activity: \"Build kitchen cabinets\"?"]
ethics_other.excuse:
  key: excuses
  label: Excuses and Obligations
  description: "Whether an excuse is a reasonable reason for not doing what someone asked or what a role requires."
  examples: ["Is \"I was sick\" a reasonable excuse for not returning the book?"]

# Wave 3
fake_job_posts.fraudulent:
  key: fraudulent_job_posts
  label: Fraudulent Job Posts
  description: "Questions a program asks about a job posting to decide whether it is a fraudulent listing rather than a real job."
  examples: ["Is this job posting a fraudulent listing?"]
contract_nli.entailment:
  key: nda_clause_checks
  label: NDA Clause Checks
  description: "Questions a program asks about an excerpt of a non-disclosure agreement to decide whether it entails, contradicts, or doesn't mention a specific clause condition."
  examples: ["Does this contract excerpt entail, contradict, or not mention that the receiving party may share information with employees?"]
esci.match:
  key: product_query_match
  label: Product-Query Match
  description: "Questions a program asks about a product listing and a shopping query to score how well the product matches: irrelevant, a complement, a substitute, or an exact match."
  examples: ["How well does this product match the shopping query?"]
pubmedqa.answer:
  key: biomedical_questions
  label: Biomedical Research Questions
  description: "Questions a program asks about a biomedical research abstract to answer a research question yes, no, or maybe based on the abstract."
  examples: ["Based on this abstract, does the treatment reduce mortality?"]
fin_news_topic.topic:
  key: financial_news_topics
  label: Financial News Topics
  description: "Questions a program asks about a financial news post to tag its topic: earnings, mergers, IPOs, macro, markets, policy, company news and so on."
  examples: ["What is this financial news post about?"]
docstring_match.accurate:
  key: docstring_accuracy
  label: Docstring Accuracy
  description: "Questions a program asks about a function and its documentation comment to decide whether the docstring accurately describes what the code does."
  examples: ["Does this docstring accurately describe what the code does?"]
code.language:
  key: language_identification
  label: Language Identification
  description: "Questions a program asks about a code snippet to identify which programming language it is written in."
  examples: ["What programming language is this code written in?"]
paws.same_meaning:
  key: paraphrase_detection
  label: Paraphrase Detection
  description: "Questions a program asks about two sentences with heavily overlapping words to decide whether they mean the same thing."
  examples: ["Do these two sentences mean the same thing?"]
ethics_util.pleasant:
  key: which_is_more_pleasant
  label: Which Is More Pleasant
  description: "Comparisons of two everyday situations to judge which one would feel more pleasant for the person living it."
  examples: ["Which is more pleasant: 'I got a free coffee' or 'I got a free coffee and the barista remembered my name'?"]
ethics_util.justice:
  key: fair_justifications
  label: Fair Justifications
  description: "Whether a stated reason is a fair justification for treating someone a certain way or for what they deserve."
  examples: ["Is 'because she worked overtime all week' a reasonable justification for 'I gave my employee a bonus'?"]
caption_contest.funny:
  key: cartoon_captions
  label: Cartoon Caption Humor
  description: "How funny a caption is for a described New Yorker cartoon, judged against thousands of readers' votes."
  examples: ["How funny is this caption for the cartoon?"]
humicroedit.funny:
  key: edited_headlines
  label: Edited Headline Humor
  description: "How funny a news headline becomes when one word is swapped for a humorous replacement."
  examples: ["How funny is this edited news headline?"]
concreteness.concreteness:
  key: word_concreteness
  label: Word Concreteness
  description: "How concrete a word feels: whether what it means can be directly seen, heard, touched, smelled, tasted or done, or only explained with other words."
  examples: ["How concrete is the word \"metro\"?"]
glasgow_norms.familiarity:
  key: word_familiarity
  label: Word Familiarity
  description: "How familiar a word is to most people, from never seen to used every day."
  examples: ["How familiar is the word \"quokka\" to most people?"]
glasgow_norms.arousal:
  key: word_arousal
  label: Word Arousal
  description: "How calming or stirring a word feels to most people."
  examples: ["How calming or stirring does the word \"storm\" feel?"]
glasgow_norms.valence:
  key: word_pleasantness
  label: Word Pleasantness
  description: "How pleasant or unpleasant a word feels to most people."
  examples: ["How pleasant does the word \"sunshine\" feel?"]

# Wave 4
cola.grammatical:
  key: grammatical_acceptability
  label: Grammatical Acceptability
  description: "Questions a program asks about a sentence to decide whether it is grammatical, acceptable English."
  examples: ["Is this sentence grammatical English?"]
steam.recommends:
  key: player_recommendations
  label: Player Recommendations
  description: "Questions a program asks about a video game review to decide whether the player who wrote it recommends the game."
  examples: ["Does the player who wrote this review recommend the game?"]
medqp.same_question:
  key: medical_question_matching
  label: Medical Question Matching
  description: "Questions a program asks about two patient questions to decide whether they ask the same medical question and need the same answer."
  examples: ["Do these two questions ask the same medical question?"]

# Wave 5
amazon_helpful.helpful:
  key: review_helpfulness
  label: Review Helpfulness
  description: "Questions a program asks about a product review to decide whether it is helpful to a shopper deciding whether to buy, judged against shoppers' helpfulness votes."
  examples: ["Is this review helpful to a shopper deciding whether to buy the product?"]
legalbench.definition:
  key: term_definitions
  label: Term Definitions in Opinions
  description: "Questions a program asks about a sentence from a court opinion to decide whether it defines a term."
  examples: ["Does this sentence from a court opinion define a term?"]
legalbench.legal_area:
  key: legal_help_areas
  label: Legal Help Areas
  description: "Questions a program asks about a person's request for legal help to decide whether it raises an issue in a given area of law: housing, family, employment, debt, immigration, crime and so on."
  examples: ["Does this legal-help request raise an issue in housing law?"]
legalbench.overruling:
  key: overruling_detection
  label: Overruling Detection
  description: "Questions a program asks about a sentence from a court opinion to decide whether it overrules a previous case."
  examples: ["Does this sentence from a court opinion overrule a previous case?"]
legalbench.decision_section:
  key: decision_sections
  label: Court Decision Sections
  description: "Questions a program asks about a paragraph from a court decision to classify the function it serves: facts, procedural history, issue, rule, analysis, conclusion."
  examples: ["What function does this paragraph serve in the court decision?"]
legalbench.cuad_provision:
  key: cuad_provisions
  label: Commercial Contract Provisions
  description: "Questions a program asks about a clause from a commercial contract to decide whether it contains a specific kind of provision, such as non-compete, exclusivity, change of control or audit rights."
  examples: ["Does this clause contain a non-compete provision?"]
scicite.intent:
  key: citation_intent
  label: Citation Intent
  description: "Questions a program asks about a sentence from a scientific paper to decide why it cites another work: as background, for its method, or to compare results."
  examples: ["Why does this sentence cite the work?"]
evidence_inference.effect:
  key: clinical_trial_effects
  label: Clinical Trial Effects
  description: "Questions a program asks about evidence from a clinical trial report to decide how an intervention affected an outcome compared with a comparator: significantly increased, decreased, or no significant difference."
  examples: ["According to this evidence, how did the intervention affect blood pressure compared with placebo?"]
trec_qc.answer_type:
  key: answer_types
  label: Question Answer Types
  description: "Questions a program asks about a user's question to decide what kind of answer it is looking for: a person, a place, a number, a definition, an entity, or an abbreviation."
  examples: ["What kind of answer is this question looking for?"]

# wave 6: nodes stacking several large templates (docs/10-expansion.md §7)
cfpb_complaints.product:
  key: complaint_product
  label: Complaint Product
  description: "Questions a program asks about a consumer's complaint to a financial company to decide which product it concerns: a mortgage, credit card, student loan, bank account, debt collection, and so on."
  examples: ["Which financial product is this complaint about?"]
cfpb_complaints.issue:
  key: complaint_issue
  label: Complaint Issue
  description: "Questions a program asks about a consumer's complaint to a financial company to classify what went wrong: billing disputes, incorrect credit reports, collection practices, account management."
  examples: ["What issue is this complaint mainly about?"]
gold_headlines.direction:
  key: price_direction_news
  label: Price Direction in News
  description: "Questions a program asks about a commodities news headline to read which way it reports a price moving: up, down, or neither."
  examples: ["Does this headline report the gold price going up, going down, or neither?"]
gold_headlines.asset_comparison:
  key: asset_comparison_news
  label: Asset Comparisons in News
  description: "Questions a program asks about a markets headline to tell whether it compares one asset against another, such as gold against the dollar or equities."
  examples: ["Does this headline compare gold with another asset?"]
finer_xbrl.concept:
  key: xbrl_tagging
  label: Financial Statement Tagging
  description: "Questions a program asks about a number in a company filing to tag which accounting concept it reports: revenue, goodwill, debt, share count, and so on."
  examples: ["Which accounting concept does this number in the filing report?"]
linkedin_jobs.seniority:
  key: job_seniority
  label: Job Seniority
  description: "Questions a program asks about a job posting to decide what experience level it hires for, from internship and entry level to director and executive."
  examples: ["What experience level is this job posting hiring for?"]
linkedin_jobs.work_type:
  key: job_work_type
  label: Job Work Type
  description: "Questions a program asks about a job posting to classify the arrangement it offers: full-time, part-time, contract, temporary, internship, volunteer."
  examples: ["What kind of employment does this posting offer?"]
skillspan_jobs.requires_skill:
  key: skill_mentions
  label: Skill Mentions
  description: "Questions a program asks about a sentence from a job posting to detect whether it names a skill or body of knowledge the job requires."
  examples: ["Does this sentence from a job posting name a skill the job asks for?"]
abcd_flows.flow:
  key: customer_need
  label: Customer Need
  description: "Questions a program asks about a customer-service conversation to classify what the customer needs help with: an order, a return, their account, shipping, a promotion."
  examples: ["What does the customer need help with in this conversation?"]
abcd_flows.subflow:
  key: customer_need_detail
  label: Customer Need Detail
  description: "Questions a program asks about a customer-service conversation to pin down the specific request within a broad need, such as a refund status versus a return label."
  examples: ["Which specific request is the customer making?"]
banking77.intent:
  key: banking_intent
  label: Banking Intent
  description: "Questions a program asks about a bank customer's message to route it to the exact request: a lost card, a pending transfer, a declined payment, an exchange rate."
  examples: ["What is the customer asking the bank to do?"]
clone_pairs.same_function:
  key: code_clones
  label: Code Clones
  description: "Questions a program asks about two snippets of code to decide whether they implement the same functionality, however differently written."
  examples: ["Do these two methods implement the same functionality?"]
poj_clones.same_problem:
  key: same_problem_solutions
  label: Same-Problem Solutions
  description: "Questions a program asks about two programs to decide whether they solve the same programming problem."
  examples: ["Do these two programs solve the same problem?"]
code_review_need.needs_comment:
  key: review_needed
  label: Review Needed
  description: "Questions a program asks about a code change to decide whether a reviewer would leave a comment on it or approve it as is."
  examples: ["Would a reviewer comment on this change?"]
entity_typing.conll_type:
  key: named_entity_type
  label: Named Entity Type
  description: "Questions a program asks about a name in a sentence to type it as a person, organization, location, or other kind of name."
  examples: ["What type of entity is this name in the sentence?"]
entity_typing.wnut_type:
  key: emerging_entity_type
  label: Emerging Entity Type
  description: "Questions a program asks about a name in a noisy social-media post to type it: a person, corporation, product, creative work, group, or place."
  examples: ["What type of entity is this name in the post?"]
qnli.contains_answer:
  key: passage_answers
  label: Passage Answers Question
  description: "Questions a retrieval program asks about a passage to decide whether it contains the answer to a user's question before passing it to a model."
  examples: ["Does this passage contain the answer to the question?"]
squad2_spans.answer_span:
  key: answer_span
  label: Answer Span
  description: "Questions a program asks about a passage to pick the span that answers a question, or to say the passage has no answer."
  examples: ["Which part of the passage answers the question?"]
trec_covid.pair:
  key: document_pairs
  label: Document Pairs
  description: "Questions a search program asks about two documents to decide which better answers a query."
  examples: ["Which of these two documents better answers the query?"]
esci.pairwise:
  key: product_pairs
  label: Product Pairs
  description: "Questions a shopping search program asks about two products to decide which better matches what a shopper typed."
  examples: ["Which of these two products better matches the search?"]
math.subject:
  key: problem_subject
  label: Problem Subject
  description: "Questions a routing program asks about a math problem to classify which area it comes from: algebra, geometry, number theory, counting and probability, precalculus."
  examples: ["Which area of mathematics is this problem from?"]
math.hardest:
  key: problem_difficulty
  label: Problem Difficulty
  description: "Questions a routing program asks about math problems to judge which is hardest, so the hard ones go to a stronger model."
  examples: ["Which of these problems is hardest?"]
commit_diff_match.message_fits:
  key: message_fits_diff
  label: Message Fits Diff
  description: "Questions a program asks about a commit to check whether its message accurately describes the code change."
  examples: ["Does this commit message describe the change?"]
commit_messages.type:
  key: commit_type
  label: Commit Type
  description: "Questions a program asks about a commit message to classify the change: a fix, a feature, docs, a refactor, tests, CI, a chore."
  examples: ["What kind of change does this commit message describe?"]
clickbait.is_clickbait:
  key: clickbait
