notes: >
  "How concrete is the word X?" (template_id concreteness.concreteness) with five concrete levels and the raters'
  mean/SD mapped to a normal(mean, max(SD, 0.3)) cut at 1.5, 2.5, 3.5, 4.5 of the 1-5 scale; n = raters who knew
  the word. Pool: single lowercase words (no bigrams), SUBTLEX-US count >= 150 (about 3 per million), known by
  >= 95% of raters, and not in the Glasgow Norms (glasgow_norms must be fetched first), so the two sources never
  overlap. Salted-hash sample of ASKJEV_TARGET_CONCRETENESS (default 3000). node_hint: boolq keyword rules on the
  word, else `world`. Also holds the shared word-norm helpers used by lancaster and glasgow_norms.
