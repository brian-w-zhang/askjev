name: support_tickets
url: https://huggingface.co/datasets/Tobi-Bueck/customer-support-tickets
download: https://huggingface.co/api/datasets/Tobi-Bueck/customer-support-tickets/parquet/default/train/0.parquet
license: CC-BY-NC-4.0
version: HF Tobi-Bueck/customer-support-tickets default/train (61,765 tickets; 28,261 English)
target: 5000
hemisphere: machine
shape: route, score
notes: >
  English rows only; literal "\n" turned into newlines, whitespace collapsed, case-insensitive body
  dedup, bodies < 40 chars dropped. State `ticket` = "Subject: ...\n\n<body>", capped at 1,500 chars.
  The tickets are synthetic (generated by the author's ticket generator) and labels come with the
  generator; spot checks show some noisy queue and priority labels, so truth is weak (meta.synthetic_tickets).
  Template support_tickets.queue (Choice, node machine.support.routing): "Which team should handle
  `ticket`?" over the 10 queues (descriptions from the dataset card). Round-robin over queues in salted
  hash order. ASKJEV_TARGET_SUPPORT_TICKETS_QUEUE (default 2,500).
  Template support_tickets.priority (Score, node machine.support.urgency_frustration): "How urgent is
  `ticket`?" with three situation levels for low / medium / high (the card's definitions). One third per
  level. ASKJEV_TARGET_SUPPORT_TICKETS_PRIORITY (default 2,500).
