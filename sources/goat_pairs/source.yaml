name: goat_pairs
url: https://qlever.dev/api/wikidata (fallback https://query.wikidata.org/)
license: CC0 (Wikidata)
version: SPARQL + entity-API pulls cached 2026-09-24 (data/raw/goat_pairs/<category>.json)
target: 6600
target_wave4: 11100 (ASKJEV_TARGET_GOAT_PAIRS; picks TARGET // 300 categories in order, unset = the original 22, byte-identical)
target_wave5: 14700 (ASKJEV_TARGET_GOAT_PAIRS=14700 appends 12 categories after the 37; 11100 = the wave 4 rows byte-identical)
hemisphere: world
kind: taste (evaluative for scientists)
notes: >
  G3 "Jev's GOAT lists". 22 categories (films, TV series, video games, books, albums, bands, singers,
  painters, paintings, soccer players and clubs, tennis players, F1 drivers, cities and countries to visit,
  cuisines, dishes, board games, car brands, scientists, programming languages, mammals). Per category:
  candidates from one SPARQL class pattern, ranked by Wikidata sitelinks, top 25 kept after filters, then one
  Choice per unordered pair (300 per category), options in alphabetical order, no truth, template_id
  g3.<category>. Filters: labels en then mul; non-Latin, parenthesised, and (for people) digit labels dropped;
  mammals with only a scientific name dropped; per-series (P179) or per-artist caps so one franchise can't
  fill a list; a small per-category exclude list in the adapter with the reason for each QID
  (sitelink-inflated outliers, people famous for something else, contested places, non-members of the class).
  Pairs involving Russia, Ukraine, Israel, Iran (countries) or Moscow, Kyiv (cities) carry meta.flags=["political"].
  Inventions skipped: no clean Wikidata class.
  Wave 4 (ASKJEV_TARGET_GOAT_PAIRS=11100) appends 15 categories after the original 22, 300 pairs each, same
  construction: composers (>= 5 credited symphonies/operas/concertos/sonatas/quartets/compositions), film directors
  (>= 8 directed films), poets and philosophers (hand-picked allowlists of 31-33 QIDs from the top 150 by sitelinks,
  because Wikidata's occupation tags put Marx, Einstein, Picasso and Mao among them), architects (>= 5 credited
  buildings), fashion designers (singers/actors/models/politicians/businesspeople with clothing lines removed by
  occupation), operas (dramatico-musical works with genre opera, "(composer)" in the name, at most 3 per composer),
  animated TV series, video game console models, sports car models, dog breeds, national parks, islands (not
  sovereign states), cathedrals, and stadiums. kind taste except philosophers (evaluative). Xbox consoles are
  missing: their Wikidata items don't carry the console-model class.
  Wave 5 (ASKJEV_TARGET_GOAT_PAIRS=14700) appends 12 categories for the thin World L1s, same construction: NFL, NBA
  and MLB franchises (current teams by league; the Athletics skipped while the name is in flux), golfers (tennis
  players, actors, footballers and others tagged golfer removed by occupation), sports to watch (types of sport;
  martial arts and mountaineering dropped), cheeses ("cheese"/"PDO" suffixes stripped), fruits (common names only;
  dried fruit, berry, nut dropped), desserts (congee dropped), cocktails, smartphone models (<= 6 per maker, labels
  kept in their own case: iPhone), operating systems (<= 4 per developer; GNU dropped), birds (common names only).
  kind taste.
