name: pii_detect
url: https://huggingface.co/datasets/ai4privacy/pii-masking-200k
download: https://huggingface.co/datasets/ai4privacy/pii-masking-200k/resolve/main/english_pii_43k.jsonl
license: Ai4Privacy license (free for individuals, non-profits and orgs of <=3 staff; no redistribution of derivatives)
version: HF ai4privacy/pii-masking-200k english_pii_43k.jsonl (43,501 synthetic English texts, 54 span labels)
target: 3000
hemisphere: machine
shape: detect, classify
notes: >
  Truth derived from span labels. Every row carries at least one span, so negatives are rows whose spans are
  all non-identifying (job, date, age, sex, city, currency, company...): hard negatives, 2.7k available.
  Rows with ambiguous labels (username/IP only, crypto, password, device IDs, plates, DOB, GPS...) never
  serve as negatives or single-category items.
  Template pii_detect.contains_pii (Noul, 1,600, 50/50): truth = name, email, phone, street address, SSN,
  bank account/IBAN or card number present.
  Template pii_detect.pii_kind (Choice, 1,400) over name / email_address / phone_number / postal_address /
  government_id / bank_account / payment_card / online_identifier / none: only rows with exactly one
  category and nothing ambiguous; round-robin balanced (~155 each).
  Texts are synthetic (LLM-generated by ai4privacy) and some spans are mislabelled (e.g. a first name tagged
  MIDDLENAME); categories group labels so this rarely changes truth.
  Targets: ASKJEV_TARGET_PII_DETECT (Noul), ASKJEV_TARGET_PII_DETECT_KIND (Choice).
