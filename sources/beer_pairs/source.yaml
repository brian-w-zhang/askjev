hemisphere: self
kind: taste
notes: >
  Pairwise taste Choices "Which beer would you rather drink?" (template_id beer_pairs.drink). Beers with at least
  400 BeerAdvocate reviews (808 beers; review_overall 1-5 in half steps; one review per user per beer, the first).
  Each BeerAdvocate style is mapped to a family (IPA, pale ale, amber/brown, stout/porter, lager, wheat, Belgian,
  sour, strong ale, specialty); a pair needs the same family and at least 100 users who rated both. Salted-hash
  order (prefix-stable), at most 25 pairs per beer. Options = slug keys (beer name; brewery word prefixed when several
  names collide) with "Beer by Brewery (Style)" descriptions, alphabetical. Human distribution: among co-raters,
  share giving each beer the higher overall score, ties split; n = co-raters. No truth. Node
  self.lifestyle.food_preferences. Target via ASKJEV_TARGET_BEER_PAIRS. The SNAP originals are request-only; this
  public Kaggle-derived mirror is the BeerAdvocate subset.
