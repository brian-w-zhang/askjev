notes: >
  Added for the "reading between the lines" experiment (research pass 2, idea 9). 100 crowd labels per item; 300
  items each from SNLI and MNLI, sampled evenly across entropy terciles so contested items are well represented.
  Options are described in plain words instead of the NLI labels. Placed at a new node
  world.society.languages.sentence_inference.
