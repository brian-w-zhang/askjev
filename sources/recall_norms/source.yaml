notes: >
  Added for the "who knows it" experiment (round 3, family recall). Truth is the bin (12 bins: 0-2, 2-5, 5-10, then 10-point steps) holding the share of
  about 670 US college students who recalled the answer with no choices. The transcription's order matches Tauber's
  2012 ranks as reprinted in the German S1 table at Spearman 0.99 over the 290 items matched by text; the 9 unmatched
  items keep the transcription's wording, sentence-cased. The question shows the answer: Jev is judging how widely
  known the fact is. The German 2020 recall share (S1) is kept in meta for items asked in both studies.
