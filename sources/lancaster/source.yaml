name: lancaster
url: https://osf.io/7emr6/
license: CC BY 4.0 (Lynott et al. 2020, Behavior Research Methods)
version: Lancaster_sensorimotor_norms_for_39707_words.csv (OSF Data component rwhs6, file 48wsc, fetched 2026-09-24)
target: 300
hemisphere: world
kind: perception
notes: >
  "How much do you experience "<word>" by <sense>?" for 60 hand-picked common concrete words (foods, drinks,
  animals, plants, weather, instruments, tools, materials) x 5 perceptual dimensions (visual, auditory,
  gustatory, olfactory, haptic). Raters answered on 0-5; we map the published mean and SD to a 5-level
  distribution by a normal(mean, max(SD, 0.3)) cut at 1, 2, 3, 4 (tails folded into the end bins).
  n = N_known.perceptual (raters who knew the word; HONEY and GRASS were calibration items rated by ~16k).
  The other 6 dimensions (interoceptive + 5 action effectors) are unused.
