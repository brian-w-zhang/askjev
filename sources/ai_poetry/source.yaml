name: ai_poetry
url: https://osf.io/by4cg (Porter & Machery 2024, Scientific Reports 14:26133)
license: No license stated on OSF; used for non-commercial research. Human poems are public domain; the AI poems were generated by ChatGPT 3.5 for the study.
version: Study 1 Discrimination Data.csv and Discrimination Study text.docx, fetched 2026-09-28
target: 70
hemisphere: world
kind: perception
notes: >
  Study 1 of Porter & Machery 2024: 1,634 participants judged whether each poem was written by a human or generated
  by AI. Only the seven poets whose real poems are public domain are kept (Chaucer, Shakespeare, Samuel Butler, Byron,
  Whitman, Dickinson, and Eliot's early poems: Aunt Helen, The Boston Evening Transcript, Conversation Galante,
  Morning at the Window, all 1917, and an early Harvard Advocate poem); 5 human and 5 AI poems each. Ginsberg, Plath
  and Lasky are left out (copyright). Placed at a new node world.arts.books.poetry.human_or_ai.
